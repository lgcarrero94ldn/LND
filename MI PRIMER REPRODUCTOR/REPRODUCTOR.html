<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor de Audio HTML Nativo</title>
</head>
<body>

    <!-- El atributo 'controls' es el que activa el reproductor visual -->
    <audio src="https://soundhelix.com" controls>
        Tu navegador no soporta el elemento de audio.
    </audio>

    <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3" controls></audio>

    <h3>Mi Nota de Voz Personal:</h3>

    <!-- Al poner solo el nombre, el navegador lo busca en la misma carpeta -->
    <audio src="p" controls>
        Tu navegador no soporta el elemento de audio.
    </audio>

    <audio
     src="https://cdn.freecodecamp.org/curriculum/js-music-player/can't-stay-down.mp3"
     loop
     controls>
    </audio>

    <video
    src="https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4"
    loop
    controls
    muted
    width="400">
    </video>

</body>
</html>
