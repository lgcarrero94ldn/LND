<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Audio HTML Nativo</title>
</head>
<body>

   <!-- 2. Audio local simple -->
    <audio src="prueba.mp3" controls>
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- 3. Audio local en bucle infinito -->
    <audio src="aplausos.mp3" loop controls>
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- 4. Video local silenciado y en bucle -->
    <video src="video.mp4" loop controls muted width="400">
        Tu navegador no soporta el elemento de video.
    </video>

</body>
</html>
